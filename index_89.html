const sexOf=s=>{s=strip(s);return/^(hommes?|messieurs|men|masc|garcons)\b/.test(s)?'M':/^(femmes?|dames|women|fem|filles)\b/.test(s)?'F':null};
const isName=v=>typeof v==='string'&&/[a-zà-ÿ]{2,}/i.test(v)&&isNaN(parse('t',v))&&isNaN(parse('f',v));
function rowsFromSheet(A,sheetSex){const out=[],bad=[];let sx=sheetSex,clubs=null,ev=null;
 for(const r of A){if(!r||!r.length)continue;const c0=r[0]==null?'':String(r[0]).trim(),rest=r.slice(1).filter(v=>v!=null&&String(v).trim()!=='');
  const s=sexOf(c0);if(s){sx=s;ev=null}
  if(rest.length>=2&&rest.every(v=>typeof v==='string'&&!/\d/.test(v)&&v.trim().length<=14)&&(!c0||s)){clubs=[];r.forEach((v,j)=>{if(j>0&&v!=null&&String(v).trim())clubs.push({code:String(v).trim().toUpperCase(),col:j})});continue}
  if(s&&!rest.length)continue;
  const k=evKey(c0);if(k)ev=k;else if(c0&&!s){if(rest.some(v=>!isName(v)))bad.push(c0);ev=null;continue}
  if(!ev||!clubs||!sx)continue;const t=EVM[ev].t;
  clubs.forEach((cb,ci)=>{const end=ci+1<clubs.length?clubs[ci+1].col:r.length,used={};
   for(let j=cb.col;j<end;j++){if(used[j])continue;const v=r[j];if(v==null||v==='')continue;const p=parse(t,v);if(p===null||isNaN(p))continue;
    let nm='';if(j+1<end&&isName(r[j+1])&&!used[j+1]){nm=r[j+1];used[j+1]=1}else if(j-1>=cb.col&&isName(r[j-1])&&!used[j-1]){nm=r[j-1];used[j-1]=1}
    used[j]=1;out.push({sx,ev,club:cb.code,p,name:String(nm).trim()})}})}

function datasetFromRows(rows){const D={clubs:[],data:{M:{},F:{}}};for(const x of rows){if(!D.clubs.includes(x.club))D.clubs.push(x.club);const e=(D.data[x.sx][x.ev]=D.data[x.sx][x.ev]||{});(e[x.club]=e[x.club]||[]).push([x.p,x.name])}return D}

function fromDataset(D,base){const ath=[],idx={};let n=base?base.nid||0:0;

 const old={};if(base)for(const a of base.ath)old[a.club+'|'+a.sx+'|'+norm(a.name)]=a;
 for(const sx of['M','F'])for(const e in D.data[sx])for(const c in D.data[sx][e])for(const[v,nm]of D.data[sx][e][c]){const key=c+'|'+sx+'|'+norm(nm||'?'+e);let a=idx[key];
  if(!a){const o=old[key];a=idx[key]={id:o?o.id:'a'+(++n),club:c,sx,name:nm||'(nom illisible)',cat:o?o.cat:'S',fo:o?o.fo:false,src:'x',perf:{},man:{}};
   if(o&&o.man)for(const k in o.man)if(o.perf[k]!=null){a.perf[k]=o.perf[k];a.man[k]=1}}
  if(a.src==='m'){a.src='x';a.man=a.man||{};for(const k in a.perf)a.man[k]=1}
  if(!a.perf[e]||a.man[e]||better(EVM[e].t,v,a.perf[e])){a.perf[e]=v;delete a.man[e]}}
 for(const k in idx)if(!ath.includes(idx[k]))ath.push(idx[k]);
 if(base)for(const a of base.ath)if(a.src==='m'&&!ath.includes(a))ath.push(a);
 return{ath,nid:n,clubs:D.clubs}}

 const r=fromDataset(D,null);return{div:'I',us:'WS',clubs:r.clubs,opp:'opt',ath:r.ath,nid:r.nid,lineup:{M:{},F:{}},rel:{R1:{},R2:{},R3:{}},relM:{R1:[],R2:[],R3:[]},wi:{M:{},F:{}},src:'IC27 (fichier de départ)',at:0}}

/* ---------- optimiseur : flot de coût min (athlète→épreuve, 1 scoreur par épreuve) ---------- */
function optimize(list,cap,events,wfn){const A=list.length,E=events.length,N=A+E+2,s=0,t=N-1,G=[...Array(N)].map(()=>[]);
 const add=(u,v,c,w)=>{G[u].push({v,c,w,r:G[v].length});G[v].push({v:u,c:0,w:-w,r:G[u].length-1})};
 list.forEach((a,i)=>{add(s,i+1,cap(a),0);events.forEach((e,j)=>{const w=wfn(a,e);if(w>0)add(i+1,A+1+j,1,-w)})});
 events.forEach((e,j)=>add(A+1+j,t,1,0));
 for(let it=0;it<=E;it++){const d=Array(N).fill(Infinity),pv=Array(N).fill(null);d[s]=0;
  for(let k=0;k<N;k++){let ch=false;for(let u=0;u<N;u++){if(d[u]===Infinity)continue;const g=G[u];for(let q=0;q<g.length;q++){const ed=g[q];if(ed.c>0&&d[u]+ed.w<d[ed.v]-1e-12){d[ed.v]=d[u]+ed.w;pv[ed.v]=[u,q];ch=true}}}if(!ch)break}
  if(!(d[t]<-1e-12))break;let v=t;while(v!==s){const[u,q]=pv[v];G[u][q].c--;G[v][G[u][q].r].c++;v=u}}
 const res={};list.forEach((a,i)=>G[i+1].forEach(ed=>{if(ed.v>A&&ed.v<t&&ed.c===0&&ed.w<0)res[events[ed.v-A-1]]=a}));return res}
function ptsIf(c,F,e,p){const t=EVM[e].t,ent=[{c,p}];for(const o in F[e]||{})if(o!==c)ent.push({c:o,p:F[e][o].p});const r=score(t,ent)[c];return r?r.pts:0}
function wfn(c,F){return(a,e)=>{if(!ok(a,e))return 0;const t=EVM[e].t,p=a.perf[e],pts=ptsIf(c,F,e,p);if(!pts)return 0;let m=20;for(const o in F[e]||{})if(o!==c&&better(t,p,F[e][o].p))m=Math.min(m,Math.abs(F[e][o].p-p)/p*100);return pts+0.001*m}}

/* ---------- champs adverses ---------- */
function fieldAll(sx,inclUs){const f={};for(const e of evs()){f[e]={};for(const c of S.clubs){if(c===US&&!inclUs)continue;let b=null;for(const a of athOf(c,sx))if(ok(a,e)&&(!b||better(EVM[e].t,a.perf[e],b.p)))b={p:a.perf[e],a};if(b)f[e][c]=b}}return f}
function oppField(sx,mode){const k=sx+mode;if(CACHE[k])return CACHE[k];const FA=fieldAll(sx,false);let F=FA;const asg={};
 if(mode==='opt'){const FW=fieldAll(sx,true),E=evs(),opp=S.clubs.filter(c=>c!==US);
  // tour 1 : chaque club contre les meilleures perfs de tous ; tour 2 : contre les compos du tour 1 (+ notre meilleur effectif)
  const r1={};for(const c of opp)r1[c]=optimize(athOf(c,sx),()=>2,E,wfn(c,FW));
  const F1={};for(const e of E){F1[e]={};if(FW[e][US])F1[e][US]=FW[e][US];for(const c of opp)if(r1[c][e])F1[e][c]={p:r1[c][e].perf[e],a:r1[c][e]}}
  F={};for(const e of E)F[e]={};for(const c of opp){asg[c]=optimize(athOf(c,sx),()=>2,E,wfn(c,F1));for(const e in asg[c])F[e][c]={p:asg[c][e].perf[e],a:asg[c][e]}}}
 return CACHE[k]={F,FA,asg}}
function usEntry(sx,e){let b=null;for(const id of S.lineup[sx][e]||[]){const a=id&&byId(id);if(a&&ok(a,e)&&(!b||better(EVM[e].t,a.perf[e],b.p)))b={p:a.perf[e],a}}
 const w=S.wi[sx][e];if(b&&w!=null&&!isNaN(w))b={p:w,a:b.a,wi:true};return b}

/* ---------- résultats ---------- */
function results(mode){mode=mode||S.opp;const R={tot:{},pl:{},ev:[],rel:[],pen:0,indiv:0,relp:0};S.clubs.forEach(c=>{R.tot[c]=0;R.pl[c]=[]});
 for(const sx of['M','F']){const{F,FA}=oppField(sx,mode);for(const e of evs()){const ent=[],det={},drop=[];
  for(const c in F[e]){ent.push({c,p:F[e][c].p});det[c]=F[e][c]}
  for(const c in FA[e])if(!F[e][c]||F[e][c].a!==FA[e][c].a)drop.push({c,a:FA[e][c].a,sub:F[e][c]&&F[e][c].a});
  const u=usEntry(sx,e);if(u){ent.push({c:US,p:u.p});det[US]=u}
  const sc=score(EVM[e].t,ent);for(const c in sc){R.tot[c]+=sc[c].pts;R.pl[c].push(sc[c].rank)}R.indiv+=sc[US]?sc[US].pts:0;R.ev.push({sx,e,det,sc,drop})}}
 for(const[k,l]of RL){const ent=[];for(const c of S.clubs){const v=S.rel[k][c];if(v!=null&&!isNaN(v))ent.push({c,p:v})}const sc=score('t',ent);for(const c in sc){R.tot[c]+=sc[c].pts;R.pl[c].push(sc[c].rank)}R.relp+=sc[US]?sc[US].pts:0;R.rel.push({k,l,sc,n:ent.length})}
 const ck=checks();R.pen=ck.pen;if(R.tot[US]!=null)R.tot[US]=Math.max(0,R.tot[US]-ck.pen);
 R.order=S.clubs.slice().sort((a,b)=>{if(Math.abs(R.tot[b]-R.tot[a])>1e-9)return R.tot[b]-R.tot[a];for(let p=1;p<=S.clubs.length;p++){const d=R.pl[b].filter(x=>x===p).length-R.pl[a].filter(x=>x===p).length;if(d)return d}return 0});
 return R}
function checks(){const W=[],use={},seen={M:new Set(),F:new Set()};let pen=0;
 for(const sx of['M','F'])for(const e of evs()){const L=(S.lineup[sx][e]||[]).filter(Boolean);if(L.length===2&&L[0]===L[1])W.push(['b',`${evL(e,sx)} ${SX[sx].toLowerCase()} : le même athlète est aligné deux fois`]);
  for(const id of new Set(L)){const a=byId(id);if(!a)continue;(use[id]=use[id]||[]).push(e);seen[sx].add(id);if(a.cat!=='S'&&!CATOK[a.cat][a.sx].includes(e))W.push(['b',`${a.name} (${CAT[a.cat]}) n'a pas le droit au ${evL(e,a.sx)} : points perdus`]);if(a.perf[e]==null)W.push(['w',`${a.name} au ${evL(e,a.sx)} sans perf de référence (inscrit en fin de liste)`])}}
 for(const id in use){const a=byId(id),r=relCount(id),n=use[id].length;if(n>2||n+r>3)W.push(['b',`${a.name} : ${n} épreuve(s) + ${r} relais. Max 2 épreuves + 1 relais ou 1 + 2, sinon tous ses points sautent.`])}
 for(const[k]of RL)for(const id of S.relM[k]){const a=byId(id);if(a&&!use[id]&&relCount(id)>2)W.push(['b',`${a.name} : plus de 2 relais`])}
 const min=DIV[S.div].min;for(const sx of['M','F']){const n=seen[sx].size;if(n<min){pen+=10*(min-n);W.push(['b',`${SX[sx]} : ${n} athlètes alignés en individuel sur ${min} requis → −${10*(min-n)} pts`])}
  const fo=new Set([...seen[sx]]);RL.forEach(([k])=>S.relM[k].forEach(id=>{const a=byId(id);if(a&&a.sx===sx)fo.add(id)}));const nf=[...fo].filter(id=>byId(id)?.fo).length;if(nf>2)W.push(['b',`${SX[sx]} : ${nf} athlètes étrangers (max 2) : leurs points sautent`])}
 return{W,pen,seen}}

/* ---------- optimisation de notre compo ---------- */
function optimizeUs(keepWi){for(const sx of['M','F']){const{F}=oppField(sx,S.opp),list=athOf(US,sx),E=evs(),w=wfn(US,F);const asg=optimize(list,capUs,E,w),L={},used={};
 for(const e of E){L[e]=[];if(asg[e]){L[e].push(asg[e].id);used[asg[e].id]=(used[asg[e].id]||0)+1}}
 const min=DIV[S.div].min,cnt=()=>Object.keys(used).length;
 // 2e athlète : d'abord ceux qui ne courent nulle part (effectif minimum), puis assurance avec la capacité restante
 const fill=onlyNew=>{const cand=[];for(const a of list){const u=used[a.id]||0;if(onlyNew&&u)continue;if(u>=capUs(a))continue;for(const e of E){if(L[e].length>=2||L[e].includes(a.id)||!ok(a,e))continue;cand.push({a,e,v:w(a,e)})}}
  cand.sort((x,y)=>y.v-x.v);for(const c of cand){if(onlyNew&&cnt()>=min)break;const u=used[c.a.id]||0;if(u>=capUs(c.a)||(onlyNew&&u)||L[c.e].length>=2)continue;L[c.e].push(c.a.id);used[c.a.id]=u+1}};
 fill(true);S.lineup[sx]=L}if(!keepWi)S.wi={M:{},F:{}};S.auto=true;save()}

function applyDataset(D,label,bad){if(!D.clubs.length)return report('Rien de lisible dans ce fichier : aucune perf reconnue.',true);
 snapshot('Avant import '+label);PREV=JSON.stringify(S);const before={};for(const a of athOf(US,'M').concat(athOf(US,'F')))before[a.club+a.sx+norm(a.name)]=a.perf;
 const prevIds=new Set(S.ath.map(a=>a.id)),r=fromDataset(D,S);
 const keep=new Set(r.ath.map(a=>a.id));const added=r.ath.filter(a=>!prevIds.has(a.id)).length,removed=S.ath.filter(a=>!keep.has(a.id));
 S.ath=r.ath;S.nid=r.nid;S.clubs=r.clubs;S.src=label+' · '+new Date().toLocaleDateString('fr-BE');
 for(const[k]of RL){S.relM[k]=S.relM[k].map(id=>keep.has(id)?id:'');for(const c in S.rel[k])if(!S.clubs.includes(c))delete S.rel[k][c]}
 let impr=[];for(const a of athOf(US,'M').concat(athOf(US,'F'))){const b=before[a.club+a.sx+norm(a.name)];for(const e in a.perf)if(b&&b[e]!=null&&better(EVM[e].t,a.perf[e],b[e]))impr.push(`${a.name} ${evL(e,a.sx)} ${fmt(EVM[e].t,b[e])} → ${fmt(EVM[e].t,a.perf[e])}`);}
 const perfs=S.ath.reduce((n,a)=>n+Object.keys(a.perf).length,0);
 const miss=!S.clubs.includes(US);if(miss){S.us=US=S.clubs[0]}
 optimizeUs();
 report((miss?`Attention : club ${S.us} pris par défaut, notre club n'a pas été trouvé dans le fichier. Choisis-le dans Réglages.\n`:'')+`Import réussi (${label}) : ${S.clubs.length} clubs, ${S.ath.length} athlètes, ${perfs} perfs. ${added} nouvel(le)s athlète(s), ${removed.length} retiré(s). Composition ré-optimisée.`+(impr.length?`\nProgrès ${US} : ${impr.slice(0,12).join(' · ')}${impr.length>12?' …':''}`:'')+(bad&&bad.length?`\nLignes non reconnues : ${[...new Set(bad)].slice(0,8).join(', ')}`:''),false,true)}

function opts(sx,e,cur){const t=EVM[e].t,L=athOf(US,sx).filter(a=>ok(a,e)).sort((a,b)=>t==='t'?a.perf[e]-b.perf[e]:b.perf[e]-a.perf[e]);let o=`<option value="">—</option>`;
 if(cur&&!L.find(a=>a.id===cur)){const a=byId(cur);if(a)o+=`<option value="${esc(cur)}" selected>${esc(a.name)} (sans perf)</option>`}
 return o+L.map(a=>`<option value="${esc(a.id)}"${a.id===cur?' selected':''}>${esc(a.name)} · ${fmt(t,a.perf[e])}</option>`).join('')}
function arbitrages(){const out=[];for(const sx of['M','F']){const{F}=oppField(sx,S.opp);for(const a of athOf(US,sx)){const E=evs().filter(e=>ok(a,e));if(E.length<=capUs(a)&&E.length<3)continue;
  const inL=E.filter(e=>(S.lineup[sx][e]||[]).includes(a.id));const scorer=e=>{const u=usEntry(sx,e);return u&&u.a===a};
  out.push({a,sx,items:E.map(e=>({e,pts:ptsIf(US,F,e,a.perf[e]),in:inL.includes(e),sc:scorer(e)})).sort((x,y)=>y.pts-x.pts)})}}return out}
function vCompo(R){const ck=checks();let h=`<div class="card"><div class="row" style="justify-content:space-between"><h2 style="margin:0">Composition ${esc(US)}</h2><button class="pri" data-act="opt">Optimiser la compo</button></div><p class="mut">L'optimiseur place chaque athlète là où il rapporte le plus de points <b>à l'équipe</b>, pas forcément dans sa meilleure épreuve : il compare toutes les répartitions possibles (2 épreuves max, 1 si 2 relais). Il complète ensuite la 2e place des épreuves pour atteindre ${DIV[S.div].min} athlètes par sexe. Seule la meilleure perf du club marque.</p>`;
 h+=S.auto!==false?`<p class="mut">⟳ Compo automatique : elle se recalcule dès qu'un athlète ou une perf change.</p>`:`<p class="warn">Compo modifiée à la main : elle ne se recalcule plus toute seule. « Optimiser la compo » la remet en automatique.</p>`;

 const AR=arbitrages();if(AR.length)h+=`<h3>Arbitrages des polyvalents</h3><p class="mut">Points que chaque épreuve rapporterait s'il y était le meilleur du club. ✓ = aligné.</p>`+AR.map(x=>`<div class="lev"><div><b>${esc(x.a.name)}</b> <span class="mut">${SX[x.sx]}</span><div class="pf">${x.items.map(i=>`<span class="tag${i.in?' us':''}">${evL(i.e,x.sx)} ${fmt(EVM[i.e].t,x.a.perf[i.e])} · ${P(i.pts)} pt${i.in?' ✓':''}</span>`).join(' ')}</div></div></div>`).join('');
 h+=`</div><div class="grid2">`;
 for(const sx of['M','F']){h+=`<div class="card"><h3 style="margin-top:0">${SX[sx]} · ${ck.seen[sx].size} athlètes</h3>`;
  for(const e of evs()){const L=S.lineup[sx][e]||[],x=R.ev.find(v=>v.sx===sx&&v.e===e),m=x.sc[US];
   h+=`<div class="ev"><span class="lab">${evL(e,sx)}</span><select aria-label="${evL(e,sx)} athlète 1" data-ln="${sx}|${e}|0">${opts(sx,e,L[0])}</select><select aria-label="${evL(e,sx)} athlète 2" data-ln="${sx}|${e}|1">${opts(sx,e,L[1])}</select><span class="pts${m?'':' z'}">${m?P(m.pts):0}</span></div>`}
  h+='</div>'}
 return h+'</div>'}
function vLeviers(R){const up=[],risk=[],empty=[];
 for(const x of R.ev){const t=EVM[x.e].t,u=x.det[US],me=x.sc[US],oth=Object.keys(x.det).filter(c=>c!==US).map(c=>({c,p:x.det[c].p}));
  if(!u){empty.push({x,gain:scheme(S.clubs.length)[oth.length]||0});continue}
  const ab=oth.filter(o=>better(t,o.p,u.p)).sort((a,b)=>t==='t'?b.p-a.p:a.p-b.p)[0];
  if(ab){const np=Math.round((t==='t'?ab.p-0.01:ab.p+0.01)*100)/100,g=score(t,oth.concat({c:US,p:np}))[US].pts-me.pts;up.push({x,ab,np,g,pct:Math.abs(np-u.p)/u.p*100})}
  const be=oth.filter(o=>!better(t,o.p,u.p)).sort((a,b)=>t==='t'?a.p-b.p:b.p-a.p)[0];
  if(be){const ent=oth.map(o=>o.c===be.c?{c:o.c,p:t==='t'?u.p-0.01:u.p+0.01}:o).concat({c:US,p:u.p}),l=me.pts-score(t,ent)[US].pts;risk.push({x,be,l,pct:Math.abs(be.p-u.p)/u.p*100})}}
 up.sort((a,b)=>a.pct-b.pct);risk.sort((a,b)=>a.pct-b.pct);
 const wi=x=>{const v=S.wi[x.sx][x.e];return`<input class="perf" placeholder="tester" aria-label="Tester une perf" data-wi="${x.sx}|${x.e}" value="${v!=null?esc(fmt(EVM[x.e].t,v)):''}">`};
 const anyWi=['M','F'].some(s=>Object.keys(S.wi[s]).length);
 let h=`<div class="card"><div class="row" style="justify-content:space-between"><h2 style="margin:0">Où aller chercher les points</h2>${anyWi?'<button data-act="wiclr">Effacer les tests</button>':''}</div><p class="mut">Du plus petit progrès nécessaire au plus grand. « Tester » : tape la perf que l'athlète aligné pourrait faire, tout se recalcule.</p>`;
 if(empty.length)h+=`<h3>Épreuves où ${esc(US)} n'a personne</h3>`+empty.map(o=>`<div class="lev"><div><b>${evL(o.x.e,o.x.sx)} ${SX[o.x.sx].toLowerCase()}</b><div class="mut">Aucun athlète du club n'a de perf ici. Aligner quelqu'un rapporte au moins ce total.</div></div><span class="big good">+${P(o.gain)}</span></div>`).join('');
 h+=`<h3>Gagner une place</h3>`+(up.map(o=>`<div class="lev"><div><b>${evL(o.x.e,o.x.sx)} ${SX[o.x.sx].toLowerCase()}</b> · ${esc(o.x.det[US].a.name)} ${fmt(EVM[o.x.e].t,o.x.det[US].p)}<div class="mut">Battre ${esc(o.ab.c)} (${fmt(EVM[o.x.e].t,o.ab.p)}) : viser ${fmt(EVM[o.x.e].t,o.np)}, soit ${o.pct.toFixed(1).replace('.',',')} %</div></div><div style="text-align:right"><span class="big good">+${P(o.g)}</span><br>${wi(o.x)}</div></div>`).join('')||'<p class="mut">Premiers partout.</p>');
 h+=`</div><div class="card"><h2>Points en danger</h2><p class="mut">Les places tenues avec la plus petite marge sur le poursuivant.</p>`+risk.slice(0,12).map(o=>`<div class="lev"><div><b>${evL(o.x.e,o.x.sx)} ${SX[o.x.sx].toLowerCase()}</b> · ${esc(o.x.det[US].a.name)}<div class="mut">${esc(o.be.c)} à ${fmt(EVM[o.x.e].t,o.be.p)}, marge ${o.pct.toFixed(1).replace('.',',')} %</div></div><span class="big ${o.pct<1.5?'badc':'warn'}">−${P(o.l)}</span></div>`).join('')+'</div>';
 return h}

 for(const sx of['M','F']){const{asg}=oppField(sx,'opt'),{F}=oppField(sx,'opt'),A=asg[c]||{},E=evs();
  const Fc={};for(const e of E){Fc[e]={};for(const o in F[e])if(o!==c)Fc[e][o]=F[e][o];const u=usEntry(sx,e);if(u)Fc[e][US]=u}
  const used={};for(const e in A)used[A[e].id]=(used[A[e].id]||0)+1;
  const bench=athOf(c,sx).filter(a=>!used[a.id]&&E.some(e=>ok(a,e)));
  let tot=0;const rows=E.map(e=>{const a=A[e],pts=a?ptsIf(c,Fc,e,a.perf[e]):0;tot+=pts;
   const alt=athOf(c,sx).filter(b=>b!==a&&ok(b,e)).sort((x,y)=>EVM[e].t==='t'?x.perf[e]-y.perf[e]:y.perf[e]-x.perf[e])[0];
   return`<tr><td><b>${evL(e,sx)}</b></td><td>${a?esc(a.name)+' · '+fmt(EVM[e].t,a.perf[e]):'<span class="mut">personne de connu</span>'}${alt&&!used[alt.id]?`<br><span class="mut">réserve : ${esc(alt.name)} ${fmt(EVM[e].t,alt.perf[e])}</span>`:''}</td><td class="r"><span class="pts${pts?'':' z'}" style="font-size:19px">${P(pts)}</span></td></tr>`}).join('');
  const poly=athOf(c,sx).filter(a=>E.filter(e=>ok(a,e)).length>2).map(a=>`<div class="lev"><div><b>${esc(a.name)}</b><div class="pf">${E.filter(e=>ok(a,e)).map(e=>({e,p:ptsIf(c,Fc,e,a.perf[e]),in:A[e]===a})).sort((x,y)=>y.p-x.p).map(i=>`<span class="tag${i.in?' us':''}">${evL(i.e,sx)} ${fmt(EVM[i.e].t,a.perf[i.e])} · ${P(i.p)} pt${i.in?' ✓':''}</span>`).join(' ')}</div></div></div>`).join('');
  const n=Object.keys(used).length+Math.min(bench.length,Math.max(0,min-Object.keys(used).length));
  h+=`<div class="card"><div class="row" style="justify-content:space-between"><h3 style="margin:0">${SX[sx]}</h3><span class="pts">${P(tot)} pts</span></div><p class="mut">${Object.keys(used).length} athlètes qui marquent, ${bench.length} autre(s) connu(s) disponible(s)${n<min?` · <span class="warn">seulement ${n} connus sur ${min} requis : il leur manque des noms dans le fichier ou ils seront pénalisés</span>`:''}.</p>
  <table class="res">${rows}</table>${poly?`<h3>Arbitrages</h3><p class="mut">✓ = où l'optimiseur le place.</p>${poly}`:''}</div>`}

function onChange(ev){const el=ev.target,d=el.dataset;
 if(d.ln){const[sx,e,i]=d.ln.split('|');const L=S.lineup[sx][e]=S.lineup[sx][e]||[];L[+i]=el.value||'';S.auto=false;return commit()}

 if(d.pf){const[id,e]=d.pf.split('|'),v=parse(EVM[e].t,el.value);if(v===null||isNaN(v))return el.classList.add('bad');const a=byId(id);a.perf[e]=v;markMan(a,e);return commitData()}
 if(d.np){const a=byId(d.np),e=main.querySelector(`[data-ns="${d.np}"]`).value,v=parse(EVM[e].t,el.value);if(v===null||isNaN(v))return el.classList.add('bad');a.perf[e]=v;markMan(a,e);return commitData()}
 if(d.an){byId(d.an).name=el.value.trim()||'(sans nom)';return commit()}

 if(d.af){byId(d.af).fo=el.checked;return commitData()}
 if(d.oc){OC=el.value;return render()}
 if(d.ef==='club'){EF.club=el.value;return render()}
 if(d.ef==='q'){EF.q=el.value;return render()}
 if(d.rm4){const[k,i]=d.rm4.split('|');S.relM[k][+i]=el.value;S.relM[k]=[0,1,2,3].map(j=>S.relM[k][j]||'');return commitData()}
 if(d.rt){const[k,c]=d.rt.split('|'),v=parse('t',el.value);if(v===null)delete S.rel[k][c];else if(isNaN(v))return el.classList.add('bad');else S.rel[k][c]=v;return commit()}
 if(d.set==='div'){S.div=el.value;CACHE={};optimizeUs();return render()}
 if(d.set==='us'){S.us=US=el.value;CACHE={};optimizeUs();return render()}
 if(el.id==='fj'&&el.files[0]){const f=el.files[0];f.text().then(t=>readIn(t,'fichier '+f.name));return}
 if(el.id==='fx'&&el.files[0])return importFile(el.files[0]);
 if(el.id==='fp'&&el.files.length)return importPhotos([...el.files])}
main.addEventListener('click',ev=>{const b=ev.target.closest('button');if(!b)return;const d=b.dataset;
 if(d.act==='qadd'){const n=$('#qn').value.trim(),sx=$('#qs').value,e=$('#qe').value,v=parse(EVM[e].t,$('#qp').value),m=$('#qm');
  if(!n){m.textContent='Indique un nom.';return}if(v===null||isNaN(v)){$('#qp').classList.add('bad');m.textContent='Perf non reconnue. Exemples : 10.85 · 1:52.30 · 1m90 · 1,90';return}
  let a=athOf(US,sx).find(x=>norm(x.name)===norm(n));if(!a){S.nid=(S.nid||0)+1;a={id:'m'+S.nid+Date.now().toString(36),club:US,sx,name:n,cat:'S',fo:false,src:'m',perf:{},man:{}};S.ath.push(a)}
  a.perf[e]=v;markMan(a,e);CACHE={};optimizeUs(true);render();const q=document.getElementById('qm');if(q)q.textContent=`${a.name} : ${evL(e,sx)} ${fmt(EVM[e].t,v)} ajouté, compo recalculée.`;return}
 if(d.act==='opt'){optimizeUs();return render()}
 if(d.act==='wiclr'){S.wi={M:{},F:{}};return commit()}
 if(d.act==='undo'&&PREV){S=JSON.parse(PREV);US=S.us;PREV=null;REP={t:'Import annulé : données précédentes restaurées.'};return commit()}
 if(d.efsx){EF.sx=d.efsx;return render()}
 if(d.ts){TS=d.ts;return render()}
 if(d.act==='addath'){const n=$('#nn').value.trim();if(!n)return;S.nid=(S.nid||0)+1;S.ath.push({id:'m'+S.nid+Date.now().toString(36),club:EF.club,sx:EF.sx,name:n,cat:'S',fo:false,src:'m',perf:{},man:{}});EF.q='';return commitData()}
 if(d.rm){const[id,e]=d.rm.split('|');const a=byId(id);delete a.perf[e];if(a.man)delete a.man[e];return commitData()}
 if(d.del){if(armed!==d.del){armed=d.del;return render()}const id=d.del;S.ath=S.ath.filter(a=>a.id!==id);for(const sx of['M','F'])for(const e in S.lineup[sx])S.lineup[sx][e]=S.lineup[sx][e].map(x=>x===id?'':x);for(const[k]of RL)S.relM[k]=S.relM[k].map(x=>x===id?'':x);armed=null;return commitData()}
 if(d.opp){S.opp=d.opp;CACHE={};optimizeUs();return render()}
 if(tab==='sauvegarde'&&(d.act||d.snap!=null||d.fbh!=null))return onSaveClick(d);
});
if(isNew){optimizeUs();S.at=0;localSave()}
route();
}

</script>
</body></html>
